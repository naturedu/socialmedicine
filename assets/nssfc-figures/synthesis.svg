   <text style="font-size: 10.5px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; fill: #65756a" transform="translate(22.968 549.622192)">词表重叠可产生共现，不表示机制或因果。</text>
   <text style="font-size: 10.5px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; fill: #65756a" transform="translate(22.968 566.412554)">“荟萃”是题名汇聚，不是效应量Meta分析。</text>
