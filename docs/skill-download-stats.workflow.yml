name: Record Skill downloads

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: skill-download-statistics
  cancel-in-progress: false

jobs:
  record:
    if: github.repository == 'naturedu/socialmedicine'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify collector
        run: python3 -m unittest discover -s tests -p test_download_stats.py
      - name: Record public Release asset counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 skills/skill-download-stats/scripts/collect_downloads.py
          --repo naturedu/socialmedicine
          --asset socialmedicineskills.zip
          --asset skill-download-stats.zip
          --output data/skill-downloads.json
      - name: Save only the public snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/skill-downloads.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record public Skill download counts'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
